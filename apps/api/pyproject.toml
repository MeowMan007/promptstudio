[project]
name = "prompt-studio-api"
version = "0.1.0"
description = "Prompt Studio Python application scaffold"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "authlib>=1.9.8",
    "fastapi>=0.163.1",
    "itsdangerous>=2.2.0",
    "jsonschema>=4.26.0",
    "pydantic>=2.14.3",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "prompt_studio_api"
module-root = "src"
