services:
  - type: web
    name: prompt-studio
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: prompt-studio-db
          property: connectionString
    healthCheckPath: /health
    autoDeploy: true

databases:
  - name: prompt-studio-db
    plan: free
    databaseName: prompt_studio
    user: prompt_studio
