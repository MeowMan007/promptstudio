name: prompt-studio

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: prompt_studio
      POSTGRES_USER: prompt_studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make setup to create a local .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prompt_studio -d prompt_studio']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: prompt-studio/minio:local
    build:
      context: ./infra/docker/minio
      target: server
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run make setup to create a local .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run make setup to create a local .env}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q --spider http://127.0.0.1:9000/minio/health/live',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mail:
    image: axllent/mailpit:latest
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  seed:
    profiles: ['seed']
    image: prompt-studio/mc:local
    build:
      context: ./infra/docker/minio
      target: mc
      args:
        MC_VERSION: RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run make setup to create a local .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run make setup to create a local .env}
    volumes:
      - ./fixtures/dev:/seeds:ro
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/prompt-studio-dev &&
        mc cp /seeds/bootstrap.json local/prompt-studio-dev/seeds/bootstrap.json
    restart: 'no'

volumes:
  postgres-data:
  redis-data:
  minio-data:
