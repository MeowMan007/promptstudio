name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test & Verify Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: |
          uv sync --all-packages --all-groups
          pnpm install --frozen-lockfile

      - name: Contract tests
        env:
          PYTHONPATH: apps/api/src:.
        run: uv run pytest -q tests/contract

      - name: Unit tests
        env:
          PYTHONPATH: apps/api/src:.
        run: uv run pytest -q tests/unit

      - name: Schema generator checks
        run: |
          uv run python tools/generate_payload_schemas.py --check
          uv run python tools/generate_artifact_schema.py --check

      - name: Canvas & package tests
        run: pnpm exec vitest run packages/canvas/src/excalidraw-adapter.test.ts packages/canvas/src/edge-classification.test.ts packages/canvas/src/sketch-toolbar.test.ts packages/canvas/src/layout.test.ts packages/wireframes/src/palette.test.ts
