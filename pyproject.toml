[project]
name = "prompt-studio"
version = "0.1.0"
description = "A prompt-native visual workspace for designing applications"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/worker"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps", "backend/app", "tools"]

[tool.pytest.ini_options]
pythonpath = [".", "apps/api/src"]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "jsonschema>=4.26.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "types-jsonschema>=4.26.0.20261006",
]
